name: Leaderboard

on:
  schedule:
    - cron: "30 6 * * 2" # Tuesdays 06:30 UTC (link-check runs Mondays)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate leaderboard
        run: python scripts/leaderboard.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md data/stars.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore: update star leaderboard" && git push
          fi
